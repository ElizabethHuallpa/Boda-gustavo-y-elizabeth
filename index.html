<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boda Elizabeth y Gustavo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="lock">
  <div id="env">
    <div class="ev-scene">
      <div class="ev-table"></div>
      <div class="ev-body">
        <div class="ev-inner"></div>
        <div class="ev-piece ev-l"></div>
        <div class="ev-piece ev-r"></div>
        <div class="ev-piece ev-b"></div>
      </div>
      <div class="ev-flap">
        <div class="ev-face ev-front">
          <div class="ev-seal" role="button" tabindex="0" aria-label="Abrir invitación">
            <svg viewBox="0 0 120 120" aria-hidden="true">...</svg>
          </div>
        </div>
      </div>
      <p class="ev-hint">Toca el sello para abrir</p>
    </div>
  </div>

  <main id="main">
    <section class="hero">
      <div class="ht">
        <small>Nos casamos</small>
        <div class="names">Elizabeth <span class="amp">&</span> Gustavo</div>
        <p>Te invitamos a celebrar</p>
      </div>

      <div class="countdown">
        <div class="cb"><div class="cv" id="days">00</div><div class="cl">Días</div></div>
        <div class="cb"><div class="cv" id="hours">00</div><div class="cl">Horas</div></div>
        <div class="cb"><div class="cv" id="minutes">00</div><div class="cl">Min</div></div>
      </div>
    </section>

    <section class="story">
      <h2>La historia</h2>
      ...
    </section>

    <section class="rsvp">
      <form id="rsvpForm">
        <label>Nombre</label>
        <input type="text" name="name" />
        <label>Confirmación</label>
        <select name="attendance">
          <option value="si">Sí, asistiré</option>
          <option value="no">No podré asistir</option>
        </select>
        <button type="submit" class="btn">Enviar respuesta</button>
      </form>
    </section>
  </main>

  <div id="mc" aria-label="Música de fondo" title="Música">🔊</div>
  <audio id="bg" loop preload="auto" src="..."></audio>

  <script src="script.js"></script>
</body>
</html>
