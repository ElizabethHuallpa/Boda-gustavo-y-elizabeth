<section class="rv wc p"><div class="in-w">
    <div class="flor ftl"></div><h2>Confirmar asistencia</h2>
    <p class="sub">Estamos deseando verte. Por favor, confirma tu asistencia antes del 20 de noviembre de 2026.</p>
    <form id="rsvpForm" class="card rsvp" novalidate>
      <div class="fg">
        <label for="rsvpName">Nombre completo <span class="req" aria-hidden="true">*</span></label>
        <input id="rsvpName" name="nombre" type="text" autocomplete="off" required maxlength="120" placeholder="Nombre y apellidos" aria-describedby="hint-name err-name" aria-autocomplete="list" />
        <ul id="rsvpSuggest" class="res" role="listbox" hidden></ul>
        <p class="hint" id="hint-name"></p>
        <p class="auth" id="authInfo" hidden>Asistentes autorizados: <b id="authN">1</b> <span id="authNote"></span></p>
        <p class="err" id="err-name" role="alert"></p>
      </div>
      <fieldset class="fg">
        <legend>¿Podrás acompañarnos? <span class="req" aria-hidden="true">*</span></legend>
        <label class="opt"><input type="radio" name="asistencia" value="asistire"> <span>Asistiré</span></label>
        <label class="opt"><input type="radio" name="asistencia" value="no_asistire"> <span>No podré asistir</span></label>
        <p class="err" id="err-att" role="alert"></p>
      </fieldset>
      <div class="fg" id="seatsBox" hidden>
        <label for="rsvpSeats">¿Cuántas personas asistirán, contándote a ti? <span class="req" aria-hidden="true">*</span></label>
        <select id="rsvpSeats" name="asistentes" aria-describedby="err-seats"></select>
        <p class="err" id="err-seats" role="alert"></p>
      </div>
      <div class="fg" id="guestNamesBox" hidden>
        <label>Nombres de los acompañantes <small>(según tus pases asignados)</small></label>
        <div id="guestNamesList" style="display:grid;gap:10px;margin-top:8px"></div>
        <p class="err" id="err-guestNames" role="alert"></p>
      </div>
      <div class="fg">
        <label for="rsvpMsg">Mensaje para los novios <small>(opcional)</small></label>
        <textarea id="rsvpMsg" name="mensaje" rows="3" maxlength="500" placeholder="Escríbenos unas palabras"></textarea>
      </div>
      <div class="hp" aria-hidden="true"><label>No llenar este campo<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn" id="rsvpSubmit" type="submit">Enviar respuesta</button>
      <div id="rsvpStatus" class="status" role="status" aria-live="polite" hidden></div>
    </form>
  </div></section>
